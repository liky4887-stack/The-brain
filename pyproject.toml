[project]
name = "the-brain"
version = "0.1.0"
description = "Factory planning engine core (ground-zero stages 0-4)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "ortools>=9.10",
  "pydantic>=2",
  "pyvrp>=0.11",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "benchmark: Stage-gate benchmark tests (slow; run explicitly with -m benchmark)",
]
