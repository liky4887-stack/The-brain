name: probe-bench3
on:
  push:
    branches: [probe/bench3]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r config/ci-requirements.txt pytest pytest-xdist pytest-timeout
      - name: list benchmark-marked tests
        env:
          PYTHONPATH: packages/brain-core
        run: python -m pytest tests -m benchmark --collect-only -q -p no:cacheprovider | tee collected.txt
      - name: benchmark-marked tests, verbose, per-test timeout, durations, live per-test lines
        env:
          PYTHONPATH: packages/brain-core
          PYTHONUNBUFFERED: "1"
        run: |
          echo "SHA $GITHUB_SHA"
          python -m pytest tests -m benchmark -v -rA -n 4 --dist loadfile --timeout=3000 -o timeout_method=thread --durations=30 -p no:cacheprovider 2>&1 | tee bench.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-log
          path: |
            bench.log
            collected.txt
