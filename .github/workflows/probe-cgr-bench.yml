name: probe-cgr-bench
on:
  push:
    branches: [probe/cgr-bench]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544" highspy pytest
      - name: benchmark-marked stage-gate tests (no -x)
        env:
          PYTHONPATH: packages/brain-core
        run: |
          echo "SHA $GITHUB_SHA"
          python -m pytest tests -q -m benchmark -p no:cacheprovider
