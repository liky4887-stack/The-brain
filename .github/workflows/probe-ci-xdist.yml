name: probe-ci-xdist
on:
  push:
    branches: [probe/ci-xdist]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544" highspy pytest pytest-xdist
      - name: ci.yml suite with xdist, every test still gating
        env:
          PYTHONPATH: packages/brain-core
        run: |
          echo "SHA $GITHUB_SHA"; nproc; free -g | head -2
          python -m pytest tests -v --durations=40 -n auto --dist loadfile -m "not benchmark" -p no:cacheprovider
