name: scale-ceiling
# Ceiling discovery (Stage 5): how far past the measured 6.6M-variable
# aggregate can the free Actions fabric take the repo's own solver?
# Parameterized by config/scale.json (plants, shards, step). Each run
# is one ladder step, driven by benchmarks/scale_ceiling.py. Every
# number in RESULT.json is MEASURED on the fabric; single-runner
# projections stay labelled EXTRAPOLATED. Free plan only: ubuntu-latest
# (4 vCPU / 16 GB), no spend, single account.
on:
  push:
    branches: [gate-scale/run]
  workflow_dispatch:
    inputs:
      block:
        description: "Block letter (A=plants 0-2047, B=2048-4095, ...)"
        required: true
        type: string
      step:
        description: "Ladder step number"
        required: true
        type: string

permissions:
  contents: write   # merge job commits RESULT.json to gate-scale-results

concurrency:
  # block + SHA in the group (review-#10): a dead/cancelling run of one
  # block can never block a new launch of another block or SHA
  group: scale-${{ github.event.inputs.block || 'push' }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards_json: ${{ steps.cfg.outputs.shards_json }}
      shards: ${{ steps.cfg.outputs.shards }}
      plants: ${{ steps.cfg.outputs.plants }}
      plant_offset: ${{ steps.cfg.outputs.plant_offset }}
      step: ${{ steps.cfg.outputs.step }}
    steps:
      - uses: actions/checkout@v4
      - name: materialize config from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - << 'PY'
          import json
          # same block table as benchmarks/launch_scale.py: the letter
          # IS the range, 2048 plants per block, 256 shards
          block = "${{ inputs.block }}".strip().upper()
          assert len(block) == 1 and block.isalpha(), block
          off = 2048 * (ord(block) - ord("A"))
          c = {"step": int("${{ inputs.step }}"), "plants": 2048,
               "shards": 256, "plant_offset": off, "block": block,
               "note": "ladder step ${{ inputs.step }} block " + block +
                       " via workflow_dispatch on main"}
          json.dump(c, open("config/scale.json", "w"), indent=1)
          print(json.dumps(c))
          PY
      - id: cfg
        run: |
          python - << 'PY'
          import json, os
          c = json.load(open("config/scale.json"))
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as fh:
              fh.write(f"shards_json={json.dumps(list(range(c['shards'])))}\n")
              fh.write(f"shards={c['shards']}\nplants={c['plants']}\n")
              fh.write(f"plant_offset={c.get('plant_offset', 0)}\n")
              fh.write(f"step={c.get('step', 0)}\n")
          PY

  canary:
    # One dry-run shard before the matrix: resolves indices and data
    # hashes from the generator and asserts they sit inside the
    # configured block range. Catches a misconfigured range/plumbing
    # in seconds instead of after a full block of wrong-plant solves.
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544"  # pinned: solver version drift between runs breaks determinism claims
      - name: canary shard 0 + last shard
        env:
          PYTHONPATH: packages/brain-core
        run: |
          cd benchmarks/gate2m
          LAST=$(( ${{ needs.setup.outputs.shards }} - 1 ))
          python solve_shard.py --shard 0 --shards ${{ needs.setup.outputs.shards }} --plants ${{ needs.setup.outputs.plants }} --plant-offset ${{ needs.setup.outputs.plant_offset }} --dry-run > canary0.json
          python solve_shard.py --shard $LAST --shards ${{ needs.setup.outputs.shards }} --plants ${{ needs.setup.outputs.plants }} --plant-offset ${{ needs.setup.outputs.plant_offset }} --dry-run > canaryN.json
          python - << 'PY'
          import json
          off = ${{ needs.setup.outputs.plant_offset }}
          plants = ${{ needs.setup.outputs.plants }}
          manifest = json.load(open("../scale/plants-manifest.json"))["hashes"]
          for f in ("canary0.json", "canaryN.json"):
              c = json.load(open(f))
              assert c["range"] == [off, off + plants], c
              assert all(off <= i < off + plants
                         for i in c["indices"]), c["indices"]
              # frozen manifest (committed), never the generator under
              # test alone: a drifted generator must fail here, not
              # forge its own expectation
              for i, h in c["sample_hashes"].items():
                  assert manifest.get(i) == h, (i, h, manifest.get(i))
              print(f, "indices", c["indices"], "IN RANGE, hashes match manifest")
          PY

  solve:
    needs: [setup, canary]
    runs-on: ubuntu-latest   # free tier on public repos: 4 vCPU / 16 GB
    timeout-minutes: 100  # above the 90-min shard wall guard: the
                          # guard fires first and uploads partials;
                          # the merge completeness check owns the
                          # verdict; jobs are NEVER rerun
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544"  # pinned: solver version drift between runs breaks determinism claims
      - name: solve shard
        run: |
          cd benchmarks/gate2m
          python - << 'PY'
          import json, os, runpy, sys
          sys.argv = ["solve_shard.py", "--shard", "${{ matrix.shard }}",
                      "--shards", "${{ needs.setup.outputs.shards }}",
                      "--plants", "${{ needs.setup.outputs.plants }}",
                      "--plant-offset", "${{ needs.setup.outputs.plant_offset }}",
                      "--workers", "4", "--seq-workers", "1",
                      "--job-budget-s", "5700",  # 6000s job timeout - setup (~180s) - upload margin; solve_shard's default 6000 is too tight once checkout+install are counted
                      "--upload-margin-s", "300",
                      "--out", os.path.join(os.environ["GITHUB_WORKSPACE"],
                                            "benchmarks", "scale", "out")]
          sys.path.insert(0, ".")
          try:
              runpy.run_path("solve_shard.py", run_name="__main__")
          finally:
              # review-#10 point 3: record the files the path ACTUALLY
              # loaded, so the chain merge diffs measured contents,
              # not a static list (capture lives in the workflow, not
              # in any solve-path file, so it never perturbs the rule)
              files = sorted({getattr(m, "__file__", "") or ""
                              for m in sys.modules.values()} - {""})
              root = os.environ["GITHUB_WORKSPACE"] + "/"
              rel = [f.replace(root, "") for f in files
                     if "/benchmarks/" in f or "/packages/" in f]
              out = os.path.join(os.environ["GITHUB_WORKSPACE"],
                                 "benchmarks", "scale", "out",
                                 "shard-${{ matrix.shard }}.json")
              if os.path.exists(out):
                  d = json.load(open(out))
                  d["loaded_files"] = rel
                  # review-#11: the budget ACTUALLY passed, recorded by
                  # the caller (not the solver's defaults): an unpassed
                  # or wrong flag is visible from the first shard and
                  # the merge rejects it
                  d["guards_actual"] = {"job_budget_s": 5700.0,
                                        "upload_margin_s": 300.0}
                  json.dump(d, open(out, "w"))
              print("loaded_files recorded:", len(rel))
          PY
      - uses: actions/upload-artifact@v4
        if: always()   # a shard that exits nonzero after its wall guard
                       # still uploads its checkpointed partial records;
                       # the merge's completeness check owns the verdict
        with:
          name: shard-${{ matrix.shard }}
          path: benchmarks/scale/out/shard-${{ matrix.shard }}.json
          retention-days: 30  # spot re-validation stays inside the retention window; 90d x growing shard counts would breach the 500 MB free artifact quota

  merge:
    needs: [setup, solve]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544"  # pinned: solver version drift between runs breaks determinism claims
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: benchmarks/scale/artifacts
          merge-multiple: true
      - name: merge + independent validation
        run: |
          cd benchmarks/gate2m
          python merge_validate.py \
            --shards ${{ needs.setup.outputs.shards }} \
            --plants ${{ needs.setup.outputs.plants }} \
            --plant-offset ${{ needs.setup.outputs.plant_offset }} \
            --expected-job-budget-s 5700 \
            --artifacts "$GITHUB_WORKSPACE/benchmarks/scale/artifacts" \
            --out "$GITHUB_WORKSPACE/benchmarks/scale"
      - name: stamp ladder metadata
        if: always()
        run: |
          python - << 'PY'
          import json, os
          p = "benchmarks/scale/RESULT.json"
          if os.path.exists(p):
              r = json.load(open(p))
              r["ladder"] = {"step": int("${{ needs.setup.outputs.step }}"),
                             "plants": int("${{ needs.setup.outputs.plants }}"),
                             "plant_offset": int("${{ needs.setup.outputs.plant_offset }}"),
                             "shards": int("${{ needs.setup.outputs.shards }}"),
                             "run_id": "${{ github.run_id }}",
                             "sha": "${{ github.sha }}"}
              json.dump(r, open(p, "w"), indent=1)
          PY
      - name: publish result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Base the results branch on its REMOTE tip: runs start from
          # different code SHAs, so branching from the local checkout
          # diverges and the push is rejected (runs #4 and scale #2 lost
          # their RESULT.json to exactly this).
          # stash the fresh RESULT across the checkout: the results
          # branch TRACKS this path, and checkout refuses to clobber an
          # untracked file
          mkdir -p /tmp/res && cp benchmarks/scale/RESULT.json /tmp/res/ || true
          # remove the local copy: checkout -B onto the results
          # branch, which TRACKS this path, refuses to clobber an
          # untracked/differing file and exits 1 (runs gate2m #6 and
          # scale #3 lost RESULT.json to exactly this)
          rm -f benchmarks/scale/RESULT.json
          git fetch origin gate-scale-results || true
          if git rev-parse --verify -q origin/gate-scale-results > /dev/null; then
            git checkout -B gate-scale-results origin/gate-scale-results
          else
            git checkout -B gate-scale-results
          fi
          mkdir -p benchmarks/scale
          cp /tmp/res/RESULT.json benchmarks/scale/RESULT.json || true
          mkdir -p benchmarks/scale
          git add benchmarks/scale/RESULT.json || exit 0
          git commit -m "scale result: run ${{ github.run_id }} (${{ github.sha }})" || exit 0
          git push origin gate-scale-results || (git pull --rebase origin gate-scale-results && git push origin gate-scale-results)
