name: scale-ceiling
# Ceiling discovery (Stage 5): how far past the measured 6.6M-variable
# aggregate can the free Actions fabric take the repo's own solver?
# Parameterized by config/scale.json (plants, shards, step). Each run
# is one ladder step, driven by benchmarks/scale_ceiling.py. Every
# number in RESULT.json is MEASURED on the fabric; single-runner
# projections stay labelled EXTRAPOLATED. Free plan only: ubuntu-latest
# (4 vCPU / 16 GB), no spend, single account.
on:
  push:
    branches: [gate-scale/run]

permissions:
  contents: write   # merge job commits RESULT.json to gate-scale-results

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards_json: ${{ steps.cfg.outputs.shards_json }}
      shards: ${{ steps.cfg.outputs.shards }}
      plants: ${{ steps.cfg.outputs.plants }}
      step: ${{ steps.cfg.outputs.step }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          python - << 'PY'
          import json, os
          c = json.load(open("config/scale.json"))
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as fh:
              fh.write(f"shards_json={json.dumps(list(range(c['shards'])))}\n")
              fh.write(f"shards={c['shards']}\nplants={c['plants']}\n")
              fh.write(f"step={c.get('step', 0)}\n")
          PY

  solve:
    needs: setup
    runs-on: ubuntu-latest   # free tier on public repos: 4 vCPU / 16 GB
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544"  # pinned: solver version drift between runs breaks determinism claims
      - name: solve shard
        run: |
          cd benchmarks/gate2m
          python solve_shard.py --shard ${{ matrix.shard }} \
            --shards ${{ needs.setup.outputs.shards }} \
            --plants ${{ needs.setup.outputs.plants }} \
            --workers 4 --seq-workers 1 \
            --out "$GITHUB_WORKSPACE/benchmarks/scale/out"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: benchmarks/scale/out/shard-${{ matrix.shard }}.json
          retention-days: 90  # super-block spot re-validation must not outlive evidence

  merge:
    needs: [setup, solve]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544"  # pinned: solver version drift between runs breaks determinism claims
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: benchmarks/scale/artifacts
          merge-multiple: true
      - name: merge + independent validation
        run: |
          cd benchmarks/gate2m
          python merge_validate.py \
            --shards ${{ needs.setup.outputs.shards }} \
            --artifacts "$GITHUB_WORKSPACE/benchmarks/scale/artifacts" \
            --out "$GITHUB_WORKSPACE/benchmarks/scale"
      - name: stamp ladder metadata
        if: always()
        run: |
          python - << 'PY'
          import json, os
          p = "benchmarks/scale/RESULT.json"
          if os.path.exists(p):
              r = json.load(open(p))
              r["ladder"] = {"step": int("${{ needs.setup.outputs.step }}"),
                             "plants": int("${{ needs.setup.outputs.plants }}"),
                             "shards": int("${{ needs.setup.outputs.shards }}"),
                             "run_id": "${{ github.run_id }}",
                             "sha": "${{ github.sha }}"}
              json.dump(r, open(p, "w"), indent=1)
          PY
      - name: publish result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Base the results branch on its REMOTE tip: runs start from
          # different code SHAs, so branching from the local checkout
          # diverges and the push is rejected (runs #4 and scale #2 lost
          # their RESULT.json to exactly this).
          # stash the fresh RESULT across the checkout: the results
          # branch TRACKS this path, and checkout refuses to clobber an
          # untracked file
          mkdir -p /tmp/res && cp benchmarks/scale/RESULT.json /tmp/res/ || true
          git fetch origin gate-scale-results || true
          if git rev-parse --verify -q origin/gate-scale-results > /dev/null; then
            git checkout -B gate-scale-results origin/gate-scale-results
          else
            git checkout -B gate-scale-results
          fi
          mkdir -p benchmarks/scale
          cp /tmp/res/RESULT.json benchmarks/scale/RESULT.json || true
          mkdir -p benchmarks/scale
          git add benchmarks/scale/RESULT.json || exit 0
          git commit -m "scale result: run ${{ github.run_id }} (${{ github.sha }})" || exit 0
          git push origin gate-scale-results || (git pull --rebase origin gate-scale-results && git push origin gate-scale-results)
