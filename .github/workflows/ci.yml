name: ci
# Review #12 pt1/5: tests + lint green on the exact SHA is a launch precondition
# (benchmarks/launch_scale.py preflight queries this workflow's result for the SHA).
on:
  push:
    branches: [main, ci/fix-suite, "fix/**", "feat/**"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet ruff
      - name: undefined names / missing imports / broken formats block
        run: ruff check --select F821,F822,F823,F632,F811,F402,F502,F504,F507,F509,F521,F522,F523,F524,F525,F701,F702,F704,F706,F707 benchmarks packages tests
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r config/ci-requirements.txt pytest pytest-xdist pytest-timeout
      - name: suite (includes test_checkpoint_payload_end_to_end)
        env:
          PYTHONPATH: packages/brain-core
        run: |
          python -m pytest tests -q -m "not benchmark" -n auto --dist loadfile --timeout=600 -o timeout_method=thread -x
