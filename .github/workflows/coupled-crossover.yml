name: coupled-crossover
# Crossover study (docs/COUPLED-MEASUREMENTS.md): monolith vs
# distributed CG on the SAME coupled instances, SAME time limit,
# heuristic-only seed. Per size: plan cost vs optimum (or vs best
# known), certified bound gap, time to first plan, monolith
# optimality-proven flag + gap at its time limit. Triggered manually
# via workflow_dispatch; results land as artifacts and are recorded
# on main by the supervising agent. Free tier only.
on:
  push:
    branches: [coupled-crossover/run]

concurrency:
  group: crossover-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sizes_json: ${{ steps.cfg.outputs.sizes_json }}
      cg_wall_s: ${{ steps.cfg.outputs.cg_wall_s }}
      monolith_limit_s: ${{ steps.cfg.outputs.monolith_limit_s }}
      alloc_every: ${{ steps.cfg.outputs.alloc_every }}
      im_every: ${{ steps.cfg.outputs.im_every }}
      stab_alpha: ${{ steps.cfg.outputs.stab_alpha }}
      iters: ${{ steps.cfg.outputs.iters }}
      replicas: ${{ steps.cfg.outputs.replicas }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          python - << 'PY'
          import json, os
          c = json.load(open("config/crossover.json"))
          out = {}
          out["sizes_json"] = json.dumps(c.get("sizes", [2, 4, 8]))
          for k in ("cg_wall_s", "monolith_limit_s", "alloc_every",
                    "im_every", "stab_alpha", "iters", "replicas"):
              out[k] = str(c.get(k, {"cg_wall_s": 600,
                                     "monolith_limit_s": 600,
                                     "alloc_every": 5, "im_every": 25,
                                     "stab_alpha": 0.3,
                                     "iters": 1000,
                                     "replicas": 5}[k]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          PY

  compare:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 5 replicas x (600s mono + 600s CG + seeds)
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(needs.setup.outputs.sizes_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544"  # pinned: solver version drift between runs breaks determinism claims
      - name: crossover run
        env:
          PYTHONPATH: packages/brain-core
          CMP_SIZES: ${{ matrix.size }}
          CMP_PHASE: base
          CMP_NO_SEED: "1"           # heuristic-only seed: never the monolith
          CMP_STAB_ALPHA: ${{ needs.setup.outputs.stab_alpha }}
          CMP_CG_ITERS: ${{ needs.setup.outputs.iters }}
          CMP_CG_WALL_S: ${{ needs.setup.outputs.cg_wall_s }}
          CMP_ALLOC_EVERY: ${{ needs.setup.outputs.alloc_every }}
          CMP_IM_EVERY: ${{ needs.setup.outputs.im_every }}
          CMP_LR_ROUNDS: "0"
          CMP_MONOLITH_LIMIT: ${{ needs.setup.outputs.monolith_limit_s }}
          CMP_REPLICAS: ${{ needs.setup.outputs.replicas }}
        run: |
          python benchmarks/coupled_comparison.py
          cp /tmp/coupled-comparison.json crossover-n${{ matrix.size }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossover-n${{ matrix.size }}
          path: crossover-n${{ matrix.size }}.json
          retention-days: 30
