# Serving layer CI: sqlite unit contract everywhere, postgres-backed
# queue against a real service container on pushes that touch serving/.
name: serving
on:
  push:
    branches: [main, "fix/**", "feat/**"]
    paths: ["serving/**", "tests/test_serving.py", "tests/test_serving_hardening.py", ".github/workflows/serving.yml"]
  pull_request:
    paths: ["serving/**", "tests/test_serving.py"]

jobs:
  serving:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: serving
          POSTGRES_USER: serving
          POSTGRES_DB: serving
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serving"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet "numpy==2.2.6" "scipy==1.15.3" "pydantic==2.11.7" "ortools==9.12.4544" "pg8000==1.31.2" pytest
      - name: Unit tests (sqlite backend)
        run: python -m pytest tests/test_serving.py tests/test_serving_hardening.py -q
      - name: Postgres-backed queue round-trip
        run: |
          psql "postgresql://serving:serving@localhost:5432/serving" -f serving/schema.sql
          DATABASE_URL="postgresql://serving:serving@localhost:5432/serving" \
            python - <<'PY'
          import os, sys
          sys.path.insert(0, "packages/brain-core"); sys.path.insert(0, "serving")
          from job_queue import JobQueue
          from worker import serve
          q = JobQueue("postgres", {"host": "localhost", "port": 5432,
                                    "user": "serving", "password": "serving",
                                    "database": "serving"})
          jid = q.submit({"seed": 3, "n_skus": 12, "days": 6,
                            "window_days": 6, "freeze_days": 3, "n_windows": 2})
          serve(q, once=True)
          got = q.get(jid)
          assert got["status"] == "done" and got["result"]["ok"], got
          print("postgres round-trip OK:", got["result"]["assignments"],
                "assignments validated")
          PY
      - name: Postgres stale-running sweep (fail_stale on a real Postgres)
        run: |
          DATABASE_URL="postgresql://serving:serving@localhost:5432/serving" \
            python - <<'PY'
          import sys
          sys.path.insert(0, "packages/brain-core"); sys.path.insert(0, "serving")
          from job_queue import JobQueue
          q = JobQueue("postgres", {"host": "localhost", "port": 5432,
                                    "user": "serving", "password": "serving",
                                    "database": "serving"})
          jid = q.submit({"seed": 1})
          assert q.claim()["id"] == jid
          assert q.fail_stale(3600) == 0, "fresh claim must be left alone"
          cur = q._conn.cursor()
          cur.execute("UPDATE jobs SET claimed_at = now() - interval '2 hours' WHERE id = %s", (jid,))
          q._conn.commit()
          assert q.fail_stale(3600) == 1
          job = q.get(jid)
          assert job["status"] == "failed" and "worker lost" in str(job["result"]), job
          print("postgres fail_stale OK")
          PY
